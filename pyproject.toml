[project]
name = "contract-intelligence-mvp"
version = "0.1.0"
description = "Standalone Code Games MVP for agentic contract corpus discovery"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
contract-intel = "contract_intel_mvp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "fastapi", "numpy"]

